spring.application.name=organiflow


spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb+srv://leonelbarriosmay:leoncio123@cluster0.6a9v7do.mongodb.net/?appName=Cluster0}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:politicas_negocio}
management.health.mongodb.enabled=false
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
#logging.level.com.sw.organiflow=DEBUG

# Deshabilita la URL de ejemplo de Petstore al abrir Swagger
springdoc.swagger-ui.disable-swagger-default-url=true

app.jwt.secret=${APP_JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
# 10,800,000 ms = 3 horas
app.jwt.expiration=${APP_JWT_EXPIRATION:10800000}

# Tu refresh token (actualmente en 7 días)
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:3000}
app.firebase.credentials=${APP_FIREBASE_CREDENTIALS:firebase-adminsdk.json}
server.port=${SERVER_PORT:8001}
