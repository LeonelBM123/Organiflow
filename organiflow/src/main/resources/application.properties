spring.application.name=organiflow


spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb+srv://leonelbarriosmay:leoncio123@cluster0.6a9v7do.mongodb.net/}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:politicas_negocio}
management.health.mongodb.enabled=false
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
#logging.level.com.sw.organiflow=DEBUG

# Deshabilita la URL de ejemplo de Petstore al abrir Swagger
springdoc.swagger-ui.disable-swagger-default-url=true

app.jwt.secret=${APP_JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
# 10,800,000 ms = 3 horas
app.jwt.expiration=${APP_JWT_EXPIRATION:10800000}

# Tu refresh token (actualmente en 7 días)
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:3000}
app.firebase.credentials=${APP_FIREBASE_CREDENTIALS:firebase-adminsdk.json}
server.port=${SERVER_PORT:8001}

# ============================================================
# Almacenamiento de documentos en AWS S3
# (ver organiflow/S3_SETUP.md para detalles de configuracion)
# ============================================================
app.s3.bucket=${APP_S3_BUCKET:organiflow-documents}
app.s3.region=${APP_S3_REGION:us-east-2}
app.s3.access-key=${APP_S3_ACCESS_KEY}
app.s3.secret-key=${APP_S3_SECRET_KEY}
# Endpoint custom solo para S3-compatible (MinIO/local). Vacio = AWS real.
app.s3.endpoint=${APP_S3_ENDPOINT:}
# true para MinIO/local (path-style). false para AWS S3 (virtual-hosted).
app.s3.path-style-access=${APP_S3_PATH_STYLE_ACCESS:false}
# Vigencia (segundos) de las URLs prefirmadas de subida/descarga.
app.s3.presign-expiration-seconds=${APP_S3_PRESIGN_EXPIRATION_SECONDS:900}

# Respaldo: limite de subida directa por el backend (la via principal es presigned a S3).
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:50MB}

# ============================================================
# Co-edicion Office con OnlyOffice Document Server (Fase 2)
# (ver organiflow/ONLYOFFICE_SETUP.md)
# ============================================================
# Si false, los Office caen a ver/descargar (no se ofrece co-edicion).
app.onlyoffice.enabled=${APP_ONLYOFFICE_ENABLED:true}
# URL del Document Server ACCESIBLE DESDE EL NAVEGADOR (carga api.js).
app.onlyoffice.url=${APP_ONLYOFFICE_URL:http://localhost:8082}
# Secreto JWT compartido con el DS (>= 32 caracteres). Mismo valor en JWT_SECRET del DS.
app.onlyoffice.jwt-secret=${APP_ONLYOFFICE_JWT_SECRET:onlyoffice-dev-secret-min-32-characters-long}
# URL del backend ACCESIBLE DESDE EL CONTENEDOR DEL DS (callback). En compose: nombre de servicio.
app.onlyoffice.callback-base=${APP_ONLYOFFICE_CALLBACK_BASE:http://host.docker.internal:8001}
