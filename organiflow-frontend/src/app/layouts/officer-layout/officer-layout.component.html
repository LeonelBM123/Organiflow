<div class="min-h-screen bg-gray-100">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-xl font-bold text-blue-600">Organiflow</h1>
          <span class="ml-4 px-3 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full">
            FUNCIONARIO
          </span>
        </div>

        <div class="flex items-center space-x-4">
          @if (currentUser(); as user) {
            <div class="flex items-center space-x-3">
              <div class="text-right">
                <p class="text-sm font-medium text-gray-900">{{ user.name }}</p>
                <p class="text-xs text-gray-500">{{ user.email }}</p>
              </div>
              <button
                (click)="onLogout()"
                class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-red-600 transition"
              >
                Cerrar Sesión
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </nav>

  <!-- Sidebar y contenido -->
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-sm min-h-[calc(100vh-4rem)]">
      <nav class="mt-5 px-2">
        <a
          routerLink="/officer/tasks"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          Mis Tareas
        </a>

        <a
          routerLink="/officer/completed"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition mt-1"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Tareas Completadas
        </a>

        <a
          routerLink="/officer/profile"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition mt-1"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Mi Perfil
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
