<div class="min-h-screen bg-gray-100">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-xl font-bold text-blue-600">Organiflow</h1>
          <span class="ml-4 px-3 py-1 bg-purple-100 text-purple-800 text-xs font-semibold rounded-full">
            ADMINISTRADOR
          </span>
        </div>

        <div class="flex items-center space-x-4">
          @if (currentUser(); as user) {
            <div class="flex items-center space-x-3">
              <div class="text-right">
                <p class="text-sm font-medium text-gray-900">{{ user.name }}</p>
                <p class="text-xs text-gray-500">{{ user.email }}</p>
              </div>
              <button
                (click)="onLogout()"
                class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-red-600 transition"
              >
                Cerrar Sesión
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </nav>

  <!-- Sidebar y contenido -->
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-sm min-h-[calc(100vh-4rem)]">
      <nav class="mt-5 px-2">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>

        <a
          routerLink="/admin/workflows"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition mt-1"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          Workflows
        </a>

        <a
          routerLink="/admin/departments"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition mt-1"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          Departamentos
        </a>

        <a
          routerLink="/admin/users"
          routerLinkActive="bg-blue-50 text-blue-600"
          class="group flex items-center px-4 py-3 text-sm font-medium rounded-md hover:bg-gray-50 transition mt-1"
        >
          <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          Usuarios
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
