<nav class="bg-(--surface-2) shadow-sm border-b border-(--border-default) transition-colors duration-300"
     aria-label="Barra de navegación principal">
  <div class="w-full px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <!-- Brand + role badge -->
      <div class="flex items-center gap-4">
        <h1 class="text-xl font-bold text-(--text-accent)">Organiflow</h1>
        @if (roleBadge(); as badge) {
          <span [class]="'px-3 py-1 text-xs font-bold rounded-full ' + badge.classes">
            {{ badge.label }}
          </span>
        }
      </div>

      <!-- User info + theme toggle + logout -->
      @if (user(); as u) {
        <div class="flex items-center gap-6">

          <!-- User info -->
          <div class="text-right hidden sm:flex flex-col justify-center">
            <p class="text-sm font-semibold text-(--text-primary) leading-none mb-1">{{ u.name }}</p>
            <p class="text-xs text-(--text-secondary) leading-none">{{ u.email }}</p>
          </div>

          <div class="h-8 w-px bg-(--border-default)"></div>

          <!-- Dark / light mode toggle -->
          <button
            type="button"
            (click)="themeService.toggle()"
            class="p-2 rounded-lg text-(--text-muted) hover:text-(--text-primary) hover:bg-(--surface-3) transition-colors"
            [attr.aria-label]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
            [attr.aria-pressed]="themeService.isDark()">
            @if (themeService.isDark()) {
              <!-- Sun icon — click to go light -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
              </svg>
            } @else {
              <!-- Moon icon — click to go dark -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            }
          </button>

          <div class="h-8 w-px bg-(--border-default)"></div>

          <!-- Logout -->
          <button
            type="button"
            (click)="logout.emit()"
            class="text-sm font-medium text-(--text-muted) hover:text-(--status-rejected) transition-colors">
            Cerrar Sesión
          </button>

        </div>
      }

    </div>
  </div>
</nav>
