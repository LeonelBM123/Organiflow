<aside
  class="hidden md:flex flex-col w-72 shrink-0 bg-(--surface-2) h-full border-r border-(--border-default) shadow-lg transition-all duration-300"
  aria-label="Menú de navegación lateral">

  <nav class="flex flex-col gap-1 px-3 py-6 overflow-y-auto flex-1 custom-scrollbar" aria-label="Sección de menú">
    @for (item of navItems(); track item.route) {
    <a [routerLink]="item.route"
      routerLinkActive="bg-(--surface-3) text-(--text-accent) shadow-sm ring-1 ring-(--border-default)"
      [routerLinkActiveOptions]="{ exact: false }" class="w-full group flex items-center gap-4 px-3 py-3 rounded-lg text-sm font-semibold
              text-(--text-muted) hover:bg-(--surface-3) hover:text-(--text-primary)
              transition-all duration-200 outline-none
              focus-visible:ring-2 focus-visible:ring-(--primary-500)">

      <svg class="h-5 w-5 shrink-0 transition-transform duration-200 group-hover:scale-110" fill="none"
        stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
      </svg>

      <span class="truncate tracking-wide">{{ item.label }}</span>
    </a>
    }
  </nav>

  <div class="p-4 border-t border-(--border-default) bg-(--surface-2) shrink-0">
    <div
      class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-(--surface-3) cursor-pointer transition-all duration-200 group">
      <div
        class="w-10 h-10 rounded-full bg-(--primary-500) flex items-center justify-center text-white font-bold shrink-0 shadow-sm group-hover:shadow-md transition-shadow">
        C
      </div>

      <div class="flex flex-col truncate">
        <span class="text-sm font-bold text-(--text-primary) truncate">Carlos Barrios</span>
        <span class="text-xs text-(--text-muted) font-medium truncate">Sistemas</span>
      </div>
    </div>
  </div>

</aside>
