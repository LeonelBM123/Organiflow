<div class="form-card" role="dialog" [attr.aria-label]="isEdit ? 'Editar departamento' : 'Nuevo departamento'" aria-modal="true">
  <h2 class="form-title">{{ isEdit ? 'Editar departamento' : 'Nuevo departamento' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="fields">
      <div class="field-group">
        <label class="field-label" for="dept-name">Nombre <span aria-hidden="true">*</span></label>
        <input
          id="dept-name"
          class="field-input"
          formControlName="name"
          placeholder="Ej: Departamento Comercial"
          autocomplete="off"
          aria-required="true"
        />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <span class="field-error" role="alert">El nombre es requerido (mínimo 2 caracteres)</span>
        }
      </div>

      <div class="field-group">
        <label class="field-label" for="dept-desc">Descripción</label>
        <input
          id="dept-desc"
          class="field-input"
          formControlName="description"
          placeholder="Descripción opcional"
          autocomplete="off"
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="dept-head">ID del Jefe (opcional)</label>
        <input
          id="dept-head"
          class="field-input"
          formControlName="headUserId"
          placeholder="ID del usuario jefe"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) { Guardando... } @else { {{ isEdit ? 'Guardar cambios' : 'Crear departamento' }} }
      </button>
    </div>
  </form>
</div>
