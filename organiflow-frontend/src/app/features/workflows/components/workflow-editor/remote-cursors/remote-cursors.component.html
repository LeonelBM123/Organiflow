<div class="cursors-host" aria-hidden="true">
  @for (cursor of cursors(); track cursor.userId) {
    <div
      class="cursor-item"
      [style.transform]="'translate(' + cursor.x + 'px, ' + cursor.y + 'px)'"
    >
      <svg
        class="cursor-icon"
        width="14"
        height="18"
        viewBox="0 0 14 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M1 1L1 15.5L5 11L7.5 17L9.5 16L7 10L13 10Z"
          [attr.fill]="cursor.userColor"
          stroke="white"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
      </svg>
      <span class="cursor-label" [style.background-color]="cursor.userColor">
        {{ cursor.userName }}
      </span>
    </div>
  }
</div>
