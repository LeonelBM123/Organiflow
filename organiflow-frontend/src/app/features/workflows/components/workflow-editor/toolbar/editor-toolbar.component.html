<header class="toolbar" role="banner">

  <!-- Left: back + title -->
  <div class="toolbar-left">
    <button class="back-btn" (click)="goBack()" aria-label="Volver a la lista de workflows">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="title-group">
      <h1 class="workflow-name">{{ workflow()?.name ?? 'Cargando...' }}</h1>
      <span class="status-badge" [attr.data-status]="workflow()?.status" [attr.aria-label]="statusLabel()">
        {{ statusLabel() }}
      </span>
    </div>
  </div>

  <!-- Center: save indicator + collaboration presence -->
  <div class="toolbar-center" aria-live="polite" [attr.aria-label]="saveLabel()">
    <span class="save-dot" [attr.data-status]="saveStatus()" aria-hidden="true"></span>
    <span class="save-label">{{ saveLabel() }}</span>
    <span class="center-sep" aria-hidden="true"></span>
    <app-presence-bar
      [activeUsers]="activeUsers()"
      [connectionStatus]="connectionStatus()"
    ></app-presence-bar>
  </div>

  <!-- Right: actions -->
  <div class="toolbar-right">
    @if (isEditable()) {
      <button class="btn-ghost" (click)="saveClick.emit()" aria-label="Guardar diagrama manualmente">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <path d="M2 2h9l2 2v9a1 1 0 01-1 1H2a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 2v4h5V2M5 10h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Guardar
      </button>
      <button class="btn-primary" (click)="publishClick.emit()" aria-label="Publicar workflow">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1l1.5 4.5H13l-3.5 2.5 1.5 4.5L7 10 3 12.5 4.5 8 1 5.5H5.5L7 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        Publicar
      </button>
      <button class="btn-ghost danger" (click)="archiveClick.emit()" aria-label="Archivar workflow">
        Archivar
      </button>
    }

    @if (isPublished()) {
      <span class="read-only-label" aria-label="El workflow está publicado y no es editable">Solo lectura</span>
      <button class="btn-ghost" (click)="draftClick.emit()" aria-label="Volver a borrador para editar">
        Volver a Borrador
      </button>
      <button class="btn-ghost danger" (click)="archiveClick.emit()" aria-label="Archivar workflow">
        Archivar
      </button>
    }

    @if (isArchived()) {
      <span class="read-only-label archived" aria-label="El workflow está archivado">Archivado</span>
    }
  </div>

</header>
