<div class="editor-root">

  <app-editor-toolbar
    [workflow]="workflow()"
    [saveStatus]="saveStatus()"
    [activeUsers]="activeUsers()"
    [connectionStatus]="connectionStatus()"
    (saveClick)="saveGraph()"
    (publishClick)="openPublishDialog()"
    (draftClick)="revertToDraft()"
    (archiveClick)="archiveWorkflow()"
  ></app-editor-toolbar>

  <div class="editor-body">

    <app-symbol-palette></app-symbol-palette>

    <div class="canvas-wrapper" [class.loading]="isLoading()" role="main" aria-label="Canvas del diagrama de workflow">

      @if (isLoading()) {
        <div class="canvas-loading" aria-live="polite" aria-busy="true">
          <div class="spinner" aria-label="Cargando diagrama"></div>
          <span>Cargando diagrama...</span>
        </div>
      }

      @if (!isLoading()) {
        <ejs-diagram
          #diagram
          id="organiflow-diagram"
          width="100%"
          height="100%"
          [nodes]="diagramNodes()"
          [connectors]="diagramConnectors()"
          [tool]="tool"
          [snapSettings]="snapSettings"
          [selectedItems]="selectorSettings"
          [getNodeDefaults]="getNodeDefaults"
          [getConnectorDefaults]="getConnectorDefaults"
          (dragEnter)="onDragEnter($event)"
          (collectionChange)="onCollectionChange($event)"
          (positionChange)="onPositionChange($event)"
          (connectionChange)="onConnectionChange($event)"
          (selectionChange)="onSelectionChange($event)"
          (doubleClick)="onDoubleClick($event)"
          (contextmenu)="onRightClick($event)"
          role="img"
          aria-label="Editor visual de workflow"
        ></ejs-diagram>

        <app-remote-cursors [cursors]="remoteCursors()"></app-remote-cursors>
      }
    </div>

    <app-node-panel
      [node]="selectedNode()"
      (save)="onNodePropertiesSaved($event)"
      (close)="selectedNode.set(null)"
    ></app-node-panel>

  </div>
</div>
