<div class="editor-root">

  <app-editor-toolbar [workflow]="workflow()" [saveStatus]="saveStatus()" [activeUsers]="activeUsers()"
    [connectionStatus]="connectionStatus()" (saveClick)="saveGraph()" (publishClick)="openPublishDialog()"
    (draftClick)="revertToDraft()" (archiveClick)="archiveWorkflow()"></app-editor-toolbar>

  <div class="editor-body">

    <app-symbol-palette></app-symbol-palette>

    <div #canvasWrapper class="canvas-wrapper" [class.loading]="isLoading()" role="main"
      aria-label="Canvas del diagrama de workflow">

      @if (isLoading() || isInitializingDiagram()) {
      <div class="canvas-loading" aria-live="polite" aria-busy="true">
        <div class="spinner" aria-label="Cargando diagrama"></div>
        <span>Cargando diagrama...</span>
      </div>
      }

      <div class="diagram-host" [class.hidden]="isLoading() || isInitializingDiagram()">

        <div class="diagram-drop-zone"
          (drop)="onCanvasDrop($event)"
          (dragover)="onCanvasDragOver($event)">
          <ejs-diagram #diagram id="organiflow-diagram" width="100%" height="100%"
            [constraints]="diagramConstraints"
            [getNodeDefaults]="nodeDefaults"
            [getConnectorDefaults]="connectorDefaults"
            [snapSettings]="snapSettings"
            [pageSettings]="pageSettings"
            (selectionChange)="onDiagramClick($event)"
            (doubleClick)="onDiagramDblClick($event)"
            (historyChange)="onDiagramModified()"
            (collectionChange)="onDiagramModified()"
            (positionChange)="onNodePositionChange($event)"
            (scrollChange)="onDiagramScrollChange($event)">
          </ejs-diagram>
        </div>

        <app-remote-cursors [cursors]="displayCursors()"></app-remote-cursors>

        <!-- ── Barra de IA ──────────────────────────────────────────────── -->
        @if (workflow()?.status === 'DRAFT') {
          <div class="ai-bar" role="search" aria-label="Asistente IA de diagrama">
            <svg class="ai-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/>
            </svg>
            <input
              class="ai-input"
              type="text"
              [placeholder]="isRecording() ? 'Escuchando...' : 'Ej: Agrega un paso de validación entre la tarea inicial y el fin...'"
              [value]="iaPrompt()"
              (input)="onIaPromptInput($event)"
              (keyup.enter)="pedirCambiosIA()"
              [disabled]="isAiThinking() || isRecording()"
              aria-label="Instrucción para el asistente IA"
              [class.ai-input--listening]="isRecording()"
            />
            @if (isSpeechSupported()) {
              <button
                class="ai-mic-btn"
                type="button"
                (click)="toggleRecording()"
                [class.ai-mic-btn--recording]="isRecording()"
                [disabled]="isAiThinking()"
                [attr.aria-label]="isRecording() ? 'Detener grabación' : 'Hablar con el asistente'"
                [attr.aria-pressed]="isRecording()"
              >
                @if (isRecording()) {
                  <!-- Icono stop -->
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                  </svg>
                } @else {
                  <!-- Icono micrófono -->
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                  </svg>
                }
              </button>
            }
            <button
              class="ai-btn"
              type="button"
              (click)="pedirCambiosIA()"
              [disabled]="isAiThinking() || isRecording() || !iaPrompt().trim()"
              [attr.aria-busy]="isAiThinking()"
              aria-label="Aplicar cambios con IA"
            >
              @if (isAiThinking()) {
                <span class="ai-spinner" aria-hidden="true"></span>
                Pensando...
              } @else {
                Aplicar
              }
            </button>
          </div>
        }

      </div>

    </div>

    <app-node-panel
      [node]="selectedNode()"
      [departments]="departments()"
      [users]="tenantUsers()"
      [class.open]="!!selectedNode()"
      (save)="onNodePropertiesSaved($event)"
      (close)="selectedNode.set(null)">
    </app-node-panel>

    <app-connector-panel
      [connector]="selectedConnector()"
      [class.open]="!!selectedConnector()"
      (save)="onConnectorPropertiesSaved($event)"
      (close)="selectedConnector.set(null)">
    </app-connector-panel>

  </div>
</div>
